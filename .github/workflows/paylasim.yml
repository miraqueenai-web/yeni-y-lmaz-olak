name: Haftalık paylaşım

on:
  schedule:
    - cron: "0 6 * * 1,3,5"     # Pzt-Çar-Cum 09:00 (İstanbul) — gün/platform eşlemesi config.json'da
  workflow_dispatch:
    inputs:
      platform: { description: "google | instagram | linkedin (boşsa bugünün planı)", required: false }
      topic:    { description: "Konu (boşsa kuyruktan/Claude önerir)", required: false }
      publish_draft: { description: "Onaylanmış taslağı yayınla (ör. drafts/2026-10-05-google.json)", required: false }

permissions:
  contents: write

concurrency: paylasim

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
      GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Taslak üret
        if: ${{ !inputs.publish_draft }}
        id: gen
        run: |
          ARGS=""
          [ -n "${{ inputs.platform }}" ] && ARGS="$ARGS --platform=${{ inputs.platform }}"
          [ -n "${{ inputs.topic }}" ] && ARGS="$ARGS --topic=\"${{ inputs.topic }}\""
          eval node src/generate.js $ARGS
          echo "draft=$(ls -t drafts/*.json | head -1)" >> "$GITHUB_OUTPUT"

      - name: Taslak ve görseli depoya işle
        run: |
          git config user.name "yc-otomasyon"; git config user.email "actions@users.noreply.github.com"
          git add -A drafts docs data
          git diff --cached --quiet || (git commit -m "Taslak: ${{ steps.gen.outputs.draft || inputs.publish_draft }}" && git push)

      - name: Yayınla (mode=auto veya onaylı taslak)
        run: |
          MODE=$(node -p "require('./config.json').mode")
          DRAFT="${{ inputs.publish_draft || steps.gen.outputs.draft }}"
          if [ -n "${{ inputs.publish_draft }}" ] || [ "$MODE" = "auto" ]; then
            sleep 90   # GitHub Pages görseli yayınlasın
            node src/publish.js "$DRAFT"
            git add -A drafts data
            git diff --cached --quiet || (git commit -m "Yayınlandı: $DRAFT" && git push)
          else
            echo "mode=draft: $DRAFT onay bekliyor (Actions > Run workflow > publish_draft)."
          fi
